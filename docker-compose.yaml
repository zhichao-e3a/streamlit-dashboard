services:

  streamlit:

    build: .

    container_name: streamlit-app

    ports:
      - "127.0.0.1:8501:8501"

    volumes:
      - ./config:/app/config:ro

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp
      - /home/appuser/.streamlit
      - /home/appuser/.cache

    environment:
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
